name: Build desktop apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: uv sync --locked --group build
      - name: Test source
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Build application
        run: uv run --locked --group build pyinstaller --noconfirm BlotNotebook.spec
      - name: Test macOS application
        if: runner.os == 'macOS'
        env:
          BLOTNOTEBOOK_EXECUTABLE: ${{ github.workspace }}/dist/BlotNotebook.app/Contents/MacOS/BlotNotebook
        run: uv run --locked python -m unittest discover -s tests -p test_startup.py -v
      - name: Test Windows application
        if: runner.os == 'Windows'
        env:
          BLOTNOTEBOOK_EXECUTABLE: ${{ github.workspace }}\dist\BlotNotebook\BlotNotebook.exe
        run: uv run --locked python -m unittest discover -s tests -p test_startup.py -v
      - name: Archive macOS app preserving bundle links and permissions
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/BlotNotebook.app dist/BlotNotebook-macOS.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: BlotNotebook-macOS
          path: dist/BlotNotebook-macOS.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: BlotNotebook-Windows
          path: dist/BlotNotebook/
