name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            package: macOS-arm64
          - os: macos-15-intel
            package: macOS-x64
          - os: windows-2022
            package: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: uv sync --locked --group build
      - name: Test source
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Build application
        run: uv run --locked --group build pyinstaller --noconfirm BlotNotebook.spec
      - name: Test macOS application
        if: runner.os == 'macOS'
        env:
          BLOTNOTEBOOK_EXECUTABLE: ${{ github.workspace }}/dist/BlotNotebook.app/Contents/MacOS/BlotNotebook
        run: uv run --locked python -m unittest discover -s tests -p test_startup.py -v
      - name: Test Windows application
        if: runner.os == 'Windows'
        env:
          BLOTNOTEBOOK_EXECUTABLE: ${{ github.workspace }}\dist\BlotNotebook\BlotNotebook.exe
        run: uv run --locked python -m unittest discover -s tests -p test_startup.py -v
      - name: Archive macOS app preserving bundle links and permissions
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/BlotNotebook.app dist/BlotNotebook-${{ matrix.package }}.zip
      - name: Archive Windows application folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/BlotNotebook -DestinationPath dist/BlotNotebook-${{ matrix.package }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BlotNotebook-${{ matrix.package }}
          path: dist/BlotNotebook-${{ matrix.package }}.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: BlotNotebook-*
          merge-multiple: true
          path: release-assets
      - name: Verify packages and calculate checksums
        working-directory: release-assets
        run: |
          test -s BlotNotebook-macOS-arm64.zip
          test -s BlotNotebook-macOS-x64.zip
          test -s BlotNotebook-Windows-x64.zip
          sha256sum *.zip > SHA256SUMS.txt
      - name: Publish tested packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "Blot Notebook $RELEASE_TAG" --notes-file docs/release-notes.md
          gh release upload "$RELEASE_TAG" release-assets/*
          gh release edit "$RELEASE_TAG" --draft=false
